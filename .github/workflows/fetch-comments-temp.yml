name: temp-fetch-youtube-comments

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch YouTube comments
        shell: bash
        run: |
          mkdir -p comment_exports
          python - <<'PY'
          import json
          import re
          import traceback
          from pathlib import Path
          from yt_comment_automation.yt_fetch import fetch_youtube_raw

          videos = [
              "dDb5IyO5Vpk",
              "BNTlYxN6-8o",
              "3kt1mvk4sfE",
              "3EokfsiEKE4",
          ]

          timestamp_re = re.compile(r"(?<!\d)(?:(?:\d{1,2}:)?\d{1,2}:\d{2})(?!\d)")
          keyword_re = re.compile(r"(?:セトリ|set\s*list|歌った曲|曲リスト|song\s*list)", re.I)

          for video_id in videos:
              print(f"===== VIDEO {video_id} =====")
              try:
                  data = fetch_youtube_raw(
                      video_id,
                      cache_dir=Path("comment_exports"),
                      force=True,
                  )
              except Exception as exc:
                  print(f"FETCH_ERROR {video_id}: {type(exc).__name__}: {exc}")
                  traceback.print_exc()
                  print(f"===== END VIDEO {video_id} =====")
                  continue

              comments = [str(x.get("text") or "") for x in data.get("comments", [])]
              description = str(data.get("description") or "")
              candidates = []
              for text in comments:
                  if timestamp_re.search(text) or keyword_re.search(text):
                      candidates.append(text)

              print(f"TOTAL_COMMENTS={len(comments)} TIMESTAMP_CANDIDATES={len(candidates)}")
              if description:
                  print("--- DESCRIPTION_CANDIDATES ---")
                  print(description)
              for idx, text in enumerate(candidates[:250], 1):
                  print(f"--- COMMENT_CANDIDATE {idx} ---")
                  print(text)
              print(f"===== END VIDEO {video_id} =====")
          PY

      - name: Upload raw comment exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-comments-20260908
          path: comment_exports/*.info.json
          if-no-files-found: warn
          retention-days: 3
